# Local fallback: run the whole product without any cloud service.
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      - PORT=8000
      - MODEL_DIR=/app/artifacts
    ports:
      - "8000:8000"
  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - NEXT_PUBLIC_API_BASE=http://127.0.0.1:8000
    command: sh -c "npm ci && npm run build && npm start"
    ports:
      - "3000:3000"
    depends_on:
      - api
