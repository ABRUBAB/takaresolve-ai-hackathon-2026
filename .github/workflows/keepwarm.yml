# Pings the deployed API so the free Hugging Face Space does not sleep before judging.
# Set the repository secret API_HEALTH_URL (e.g. https://<space>.hf.space/v1/health/live).
name: keepwarm

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then echo "API_HEALTH_URL not set yet - skipping"; exit 0; fi
          curl -fsS --max-time 60 "$URL" || echo "ping failed (space may be waking up)"
