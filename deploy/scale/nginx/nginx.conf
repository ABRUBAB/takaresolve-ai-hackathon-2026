worker_processes 2;
events { worker_connections 8192; }

http {
    access_log off;
    # Docker's embedded DNS: `scorer` resolves to every replica; re-resolved every 5 s so scaling needs no reload
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream scorers {
        zone scorers 64k;
        least_conn;
        server scorer:8000 resolve max_fails=3 fail_timeout=5s;
        keepalive 256;
    }

    server {
        listen 8080;
        location / {
            proxy_pass http://scorers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
        }
        location = /nginx_status { stub_status; }
    }
}
