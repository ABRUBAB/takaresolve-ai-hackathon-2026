global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: scorer                 # every replica, discovered through Docker DNS (works with --scale)
    dns_sd_configs: [{names: ["scorer"], type: A, port: 8000, refresh_interval: 5s}]
  - job_name: feature-worker
    dns_sd_configs: [{names: ["feature-worker"], type: A, port: 9100, refresh_interval: 5s}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
