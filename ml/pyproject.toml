[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "uvera-ml"
version = "0.1.0"
description = "UVERA ML package: synthetic world, features, models, uncertainty, XAI, graph, grounded briefs, evaluation"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "networkx>=3.3",
  "matplotlib>=3.8",
  "pydantic>=2.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
text = ["torch>=2.3", "sentence-transformers>=3.0"]
forecast = ["chronos-forecasting>=2.0"]
llm = ["google-genai>=1.0"]
compare = ["xgboost>=2.0", "catboost>=1.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["uvera_ml*"]

