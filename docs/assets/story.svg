<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t d">
  <title id="t">One scam, one platform</title>
  <desc id="d">Five steps: Rina drafts a transfer, UVERA pauses it with reasons, the mule tries a QR cash-out, QR Shield flags the shop, operations gets one linked case and a person decides.</desc>
  <style>
    .bg{fill:#0A0A0A}.card{fill:#111111;stroke:#262626}.n{font:700 13px Consolas,'SF Mono',Menlo,monospace;fill:#737373;letter-spacing:2px}
    .h{font:600 19px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#FAFAFA}.p{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#A3A3A3}
    .ai{font:600 11px Consolas,'SF Mono',Menlo,monospace;letter-spacing:1px}
    .line{stroke:#D7FF3A;stroke-width:2;fill:none;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 9s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:1100}55%,100%{stroke-dashoffset:0}}
    .s1{animation:in 9s infinite}.s2{animation:in 9s infinite .9s}.s3{animation:in 9s infinite 1.8s}.s4{animation:in 9s infinite 2.7s}.s5{animation:in 9s infinite 3.6s}
    @keyframes in{0%{opacity:.25}8%,90%{opacity:1}100%{opacity:.25}}
    .ring{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-out infinite}
    @keyframes pulse{0%{transform:scale(.6);opacity:1}70%,100%{transform:scale(1.25);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.line{stroke-dashoffset:0}}
  </style>
  <rect class="bg" width="1200" height="330"/>
  <path class="line" d="M124 70H1076"/>
  <g class="s1"><circle cx="124" cy="70" r="8" fill="#FAFAFA"/>
    <rect class="card" x="24" y="104" width="208" height="196" rx="12"/>
    <text class="n" x="44" y="134">01 · CUSTOMER</text><text class="h" x="44" y="166">Rina sends Tk 3,000</text>
    <text class="p" x="44" y="194">A caller says she won a</text><text class="p" x="44" y="214">prize and must pay a fee</text><text class="p" x="44" y="234">to a 2-day-old wallet.</text>
    <text class="ai" x="44" y="276" fill="#8A8A8A">BEFORE SHE TAPS CONFIRM</text></g>
  <g class="s2"><circle cx="362" cy="70" r="8" fill="#D7FF3A"/><circle class="ring" cx="362" cy="70" r="16" fill="none" stroke="#D7FF3A" stroke-width="1.5"/>
    <rect class="card" x="258" y="104" width="208" height="196" rx="12"/>
    <text class="n" x="278" y="134">02 · PAUSE CHECK</text><text class="h" x="278" y="166">High scam risk</text>
    <text class="p" x="278" y="194">3 reasons in Bangla and</text><text class="p" x="278" y="214">English. She can wait,</text><text class="p" x="278" y="234">verify, or still continue.</text>
    <text class="ai" x="278" y="276" fill="#60A5FA">AI-1 · AI-2 · AI-7</text></g>
  <g class="s3"><circle cx="600" cy="70" r="8" fill="#FAFAFA"/>
    <rect class="card" x="496" y="104" width="208" height="196" rx="12"/>
    <text class="n" x="516" y="134">03 · MULE WALLET</text><text class="h" x="516" y="166">Money is moved on</text>
    <text class="p" x="516" y="194">Other victims' money hops</text><text class="p" x="516" y="214">between wallets and goes</text><text class="p" x="516" y="234">to a QR shop for cash.</text>
    <text class="ai" x="516" y="276" fill="#8A8A8A">WITHIN 48 HOURS</text></g>
  <g class="s4"><circle cx="838" cy="70" r="8" fill="#FAFAFA"/>
    <rect class="card" x="734" y="104" width="208" height="196" rx="12"/>
    <text class="n" x="754" y="134">04 · AGENT &amp; QR</text><text class="h" x="754" y="166">QR Shield flags it</text>
    <text class="p" x="754" y="194">Round amounts, one-time</text><text class="p" x="754" y="214">payers, cash-in then drain.</text><text class="p" x="754" y="234">Karim sees why cash fell.</text>
    <text class="ai" x="754" y="276" fill="#60A5FA">AI-5 · AI-4</text></g>
  <g class="s5"><circle cx="1076" cy="70" r="8" fill="#D7FF3A"/>
    <rect class="card" x="972" y="104" width="208" height="196" rx="12"/>
    <text class="n" x="992" y="134">05 · OPERATIONS</text><text class="h" x="992" y="166">One case, not five</text>
    <text class="p" x="992" y="194">Evidence graph, brief and</text><text class="p" x="992" y="214">dispute clock. Nusrat</text><text class="p" x="992" y="234">decides. AI only advises.</text>
    <text class="ai" x="992" y="276" fill="#60A5FA">AI-6 · AI-7 · RULES</text></g>
</svg>
