    description: Same payer pays several smaller amounts in short bursts
    burst_size: [2, 5]
    burst_window_minutes: [5, 40]
  C_cash_in_pass_through:
    description: Wallet funded by cash-in, then almost fully drained to a QR merchant within minutes
    drain_ratio: [0.85, 1.0]
    gap_minutes: [2, 45]
